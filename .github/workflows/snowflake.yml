name: Snowflake build (manual)

# Optional. Stays unused until a Snowflake trial/account exists and the
# SNOWFLAKE_* repository secrets are configured. Without secrets the job
# is skipped with a notice, so forks are never broken.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check Snowflake secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        run: |
          if [ -n "$SNOWFLAKE_ACCOUNT" ] && [ -n "$SNOWFLAKE_USER" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Snowflake secrets not configured; skipping Snowflake build."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  dbt-build-snowflake:
    name: dbt build (Snowflake)
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_QUERY_TAG: cvm_funds_fidc_analytics_ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned dependencies
        run: uv sync --frozen

      - name: Prepare dbt profile
        run: cp dbt/profiles.yml.example dbt/profiles.yml

      - name: dbt deps and build
        run: |
          uv run --frozen dbt deps --project-dir dbt --profiles-dir dbt
          uv run --frozen dbt build --project-dir dbt --profiles-dir dbt --target snowflake
