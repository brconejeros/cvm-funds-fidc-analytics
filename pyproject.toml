[project]
name = "cvm-funds-fidc-analytics"
version = "0.1.0"
description = "dbt analytics over CVM open data for Brazilian investment funds and FIDCs (DuckDB local, Snowflake optional)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bruno Conejeros Fernandez dos Santos" }]
requires-python = ">=3.11,<3.14"
# dbt-core/dbt-snowflake 1.12 kept: dbt-duckdb 1.11.1 declares dbt-core>=1.8 with no upper bound and resolves cleanly against 1.12.
dependencies = [
    "dbt-core==1.12.7",
    "dbt-duckdb==1.11.1",
    "dbt-snowflake==1.12.5",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
